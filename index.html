<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exit Request Form</title>

<style>
    body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    /* Scrolling text */
    .scroll-text {
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        box-sizing: border-box;
        padding: 15px 0;
        font-size: 40px;
        font-weight: bold;
        color: red;
        letter-spacing: 5px;
    }

    .scroll-text span {
        display: inline-block;
        padding-left: 100%;
        animation: scroll 10s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }

    /* Form styling */
    .form-container {
        width: 90%;
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        background-color: #1a1a1a;
        border-radius: 10px;
        color: white;
    }

    label {
        font-size: 18px;
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }

    textarea {
        width: 100%;
        height: 120px;
        border-radius: 8px;
        padding: 10px;
        font-size: 16px;
        margin-top: 5px;
    }

    input[type="time"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        font-size: 16px;
    }

    .btn-container {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
    }

    .btn {
        width: 48%;
        padding: 12px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
    }

    .submit-btn {
        background-color: green;
    }

    .clear-btn {
        background-color: red;
    }
</style>

</head>
<body>

<!-- Scrolling SJCET -->
<div class="scroll-text">
    <span>SJCET SJCET SJCET SJCET SJCET</span>
</div>

<!-- Form -->
<div class="form-container">
    <form action="receiver.html" method="GET"> <!-- Replace receiver.html with your URL -->

        <label>Reason for Exit:</label>
        <textarea name="reason" required></textarea>

        <label>Exit Time:</label>
        <input type="time" name="exit_time" required>

        <label>Entry Time:</label>
        <input type="time" name="entry_time" required>

        <div class="btn-container">
            <button type="submit" class="btn submit-btn">Submit</button>
            <button type="reset" class="btn clear-btn">Clear</button>
        </div>

    </form>
</div>

</body>
</html>
